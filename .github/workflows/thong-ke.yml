name: Thong ke video (Buffer)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: dang-bai
jobs:
  thongke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            lich
      - name: Lay so lieu
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python3 scripts/thong_ke.py
      - name: Luu
        run: |
          git config user.name "minh-kien-bot"
          git config user.email "bot@users.noreply.github.com"
          git add lich/thong_ke.json
          git diff --cached --quiet || (git commit -m "Thong ke [skip ci]" && git pull --rebase && git push)
